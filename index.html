    <link rel="stylesheet" href="style.css" />
</head>
<body>

        <h1>Semeando Futuros</h1>

                <button class="botao" onclick="irPara('meioAmbiente')"></button>
            </div>
            <div class="card">

            </div>

    <section id="producao" class="secao">

    <script src="script.js"></script>
